<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIHAI SETU — रिहाई सेतु</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --terracotta:#D9531E;
  --peach:#F7DFC8;
  --saffron:#F5A623;
  --cream:#FDF6EE;
  --white:#FFFFFF;
  --navy:#1B2430;
  --navy-soft:#28323F;
  --green-accent:#4C7A3B;
  --heading:#1F2937;
  --body:#6B7280;
  --success:#16A34A; --success-bg:#DCFCE7;
  --warn:#DC2626; --warn-bg:#FEE2E2;
  --neutral:#1B2430; --neutral-bg:#E5E7EB;
  --gold-border:#F5A623;
  --radius:14px;
  --shadow: 0 4px 18px rgba(27,36,48,0.08);
  --font-display:'Fraunces', 'Noto Serif Devanagari', serif;
  --font-body:'Manrope', 'Noto Sans Devanagari', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
[data-lang="hi"]{ --font-display:'Noto Serif Devanagari','Fraunces',serif; --font-body:'Noto Sans Devanagari','Manrope',sans-serif; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--cream); color:var(--heading);
  font-family:var(--font-body); line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
.hidden{display:none !important;}

/* ---------- Top utility strip ---------- */
.util-bar{background:var(--navy); color:#cfd6e0; font-size:12.5px;}
.util-bar .wrap{display:flex; justify-content:space-between; align-items:center; padding-top:6px; padding-bottom:6px;}
.util-bar a{color:#cfd6e0; opacity:.9;}
.lang-toggle{display:flex; gap:2px; background:rgba(255,255,255,.08); border-radius:999px; padding:3px;}
.lang-toggle button{background:transparent; border:none; color:#cfd6e0; font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; letter-spacing:.03em;}
.lang-toggle button.active{background:var(--saffron); color:var(--navy);}

/* ---------- Header ---------- */
header.site{background:var(--white); border-bottom:1px solid #eee4d6; position:sticky; top:0; z-index:40;}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0;}
.brand{display:flex; align-items:center; gap:12px;}
.brand .mark{width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,var(--terracotta),var(--saffron)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:17px;}
.brand .name{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.02em; color:var(--navy);}
.brand .tag{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--body); margin-top:1px;}
nav.main-links{display:flex; gap:28px; font-weight:600; font-size:14.5px; color:var(--navy);}
nav.main-links a{padding:6px 2px; border-bottom:2px solid transparent;}
nav.main-links a.current, nav.main-links a:hover{border-bottom-color:var(--terracotta); color:var(--terracotta);}
.header-actions{display:flex; align-items:center; gap:14px;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:999px; font-weight:700; font-size:14px; border:none; transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--terracotta); color:#fff; box-shadow:0 6px 16px rgba(217,83,30,.28);}
.btn-primary:hover{background:#c24717;}
.btn-outline{background:transparent; color:var(--navy); border:1.5px solid #d8dde3;}
.btn-outline:hover{border-color:var(--terracotta); color:var(--terracotta);}
.btn-ghost{background:transparent; color:var(--navy); border:1.5px solid #d8dde3; padding:9px 16px; font-size:13.5px;}
.btn-navy{background:var(--navy); color:#fff;}
.btn-navy:hover{background:#0f151d;}
.btn-sm{padding:8px 14px; font-size:12.5px;}
.user-chip{text-align:right; font-size:13px;}
.user-chip .who{font-weight:700; color:var(--navy);}
.user-chip .role{color:var(--body); font-size:11.5px;}

/* ---------- HERO ---------- */
.hero{position:relative; overflow:hidden; background:linear-gradient(120deg, var(--terracotta) 0%, var(--terracotta) 32%, #E88A4C 55%, var(--peach) 100%);}
.hero::after{content:""; position:absolute; inset:0; background:radial-gradient(circle at 82% 20%, rgba(255,255,255,.18), transparent 55%);}
.hero-inner{position:relative; z-index:2; display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; padding:78px 0 64px;}
.eyebrow-pill{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:12.5px; font-weight:700; letter-spacing:.04em; padding:7px 16px; border-radius:999px; margin-bottom:22px;}
.hero h1.wordmark{
  font-family:var(--font-display); font-weight:800; letter-spacing:.01em;
  font-size:clamp(3.4rem, 7vw, 6.2rem); line-height:.98; color:#fff; margin:0 0 18px;
  text-shadow:0 6px 30px rgba(90,30,0,.25);
}
.hero .sub{font-family:var(--font-display); font-weight:600; font-size:1.5rem; color:#FFF3E4; margin:0 0 16px; max-width:560px;}
.hero p.desc{font-size:15.5px; color:#FFE9D4; max-width:560px; margin:0 0 30px;}
.hero .cta-row{display:flex; gap:14px; flex-wrap:wrap;}
.hero .cta-row .btn-outline{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.55); color:#fff;}
.hero .cta-row .btn-outline:hover{background:rgba(255,255,255,.2);}
.hero-art{position:relative; display:flex; align-items:center; justify-content:center;}
.hero-art svg{width:100%; height:auto; filter:drop-shadow(0 18px 30px rgba(60,20,0,.28));}

/* ---------- Mission strip ---------- */
.mission-strip{background:var(--cream); border-bottom:1px solid #f0e4d3;}
.mission-strip .wrap{display:flex; align-items:center; justify-content:center; gap:16px; padding:18px 0; text-align:center; flex-wrap:wrap;}
.mission-strip .dot{width:8px; height:8px; border-radius:50%; background:var(--saffron);}
.mission-strip strong{color:var(--navy); font-family:var(--font-display); font-weight:700; font-size:15.5px;}
.mission-strip span.note{color:var(--body); font-size:13.5px;}

/* ---------- Stats ---------- */
.stats-strip{background:var(--white);}
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:0; padding:52px 0;}
.stats-grid .stat{padding:0 22px; border-left:1px solid #eee4d6;}
.stats-grid .stat:first-child{border-left:none;}
.stat .num{font-family:var(--font-display); font-weight:800; font-size:2.5rem; color:var(--terracotta); line-height:1;}
.stat .label{margin-top:10px; font-size:13.5px; color:var(--heading); font-weight:600;}
.stat .src{margin-top:6px; font-size:11px; color:#a7adb6;}

/* ---------- Section shell ---------- */
section.page-section{padding:72px 0;}
section.alt{background:var(--white);}
.section-head{text-align:center; max-width:640px; margin:0 auto 44px;}
.section-head .kicker{text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:700; color:var(--terracotta); margin-bottom:10px;}
.section-head h2{font-family:var(--font-display); font-size:2.1rem; font-weight:700; color:var(--navy); margin:0 0 12px;}
.section-head p{color:var(--body); font-size:15px; margin:0;}

/* About two-col */
.about-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:start;}
.about-grid h2{font-family:var(--font-display); font-size:2rem; color:var(--navy); margin:0 0 14px;}
.about-grid p{color:var(--body); font-size:15px; margin:0 0 20px;}
.quick-links{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;}
.quick-links li a{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--navy); padding:8px 0; border-bottom:1px dashed #eadfcd;}
.quick-links li a::before{content:"→"; color:var(--terracotta); font-weight:800;}
.info-card{background:var(--white); border:1px solid #f1e6d5; border-radius:var(--radius); padding:26px; box-shadow:var(--shadow);}
.info-card h4{margin:0 0 10px; font-family:var(--font-display); color:var(--navy); font-size:16px;}
.info-card p{color:var(--body); font-size:14px; margin:0 0 8px;}

/* Feature grid */
.feature-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
.feature-card{background:var(--white); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); border-top:3px solid var(--saffron);}
.feature-card .icon{width:46px; height:46px; border-radius:12px; background:var(--peach); display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.feature-card .icon svg{width:24px; height:24px; stroke:var(--terracotta);}
.feature-card h4{margin:0 0 8px; font-size:15.5px; color:var(--navy); font-family:var(--font-display); font-weight:700;}
.feature-card p{margin:0 0 14px; font-size:13.5px; color:var(--body);}
.feature-card a.know-more{font-size:12.5px; font-weight:700; color:var(--terracotta);}

/* Banner strip */
.banner-strip{padding:0 0 72px;}
.gold-frame{border:6px solid var(--saffron); border-radius:18px; overflow:hidden; padding:2px; background:var(--white);}
.banner-inner{background:linear-gradient(115deg,#2c1a10,#5a2c14 45%, var(--terracotta) 100%); border-radius:14px; padding:52px 48px; display:flex; align-items:center; justify-content:space-between; gap:30px; flex-wrap:wrap; color:#fff;}
.banner-inner h3{font-family:var(--font-display); font-size:1.7rem; margin:0 0 8px; max-width:520px;}
.banner-inner p{color:#ffdfc2; font-size:14px; max-width:480px; margin:0;}

/* three column updates */
.updates-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.update-card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.update-card .head{background:var(--navy); color:#fff; padding:14px 18px; font-family:var(--font-display); font-weight:700; font-size:14.5px;}
.update-card ul{list-style:none; margin:0; padding:14px 18px;}
.update-card li{padding:10px 0; border-bottom:1px solid #f2ece2; font-size:13.5px; color:var(--heading);}
.update-card li:last-child{border-bottom:none;}
.update-card li time{display:block; font-size:11.5px; color:var(--body); margin-top:3px;}

/* resources panel */
.resources-grid{display:grid; grid-template-columns:1fr .8fr; gap:34px; align-items:center; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px;}
.resources-grid h3{font-family:var(--font-display); color:var(--navy); font-size:1.4rem; margin:0 0 14px;}
.resources-grid ul{margin:0; padding:0; list-style:none; columns:2; gap:8px;}
.resources-grid li{font-size:13.5px; padding:7px 0; color:var(--body); break-inside:avoid;}
.resources-grid li a{color:var(--heading); font-weight:600;}
.resources-grid li a:hover{color:var(--terracotta);}

/* partner strip */
.partners-strip{padding:44px 0; background:var(--cream); border-top:1px solid #f0e4d3; border-bottom:1px solid #f0e4d3;}
.partners-row{display:flex; justify-content:center; gap:26px; flex-wrap:wrap;}
.badge-circle{width:78px; height:78px; border-radius:50%; background:var(--white); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; text-align:center; font-size:10px; font-weight:800; color:var(--navy); padding:6px; line-height:1.2;}

/* CTA navy strip */
.cta-strip{background:var(--navy); color:#fff; padding:64px 0; text-align:center;}
.cta-strip h3{font-family:var(--font-display); font-size:1.9rem; margin:0 0 10px;}
.cta-strip p{color:#c3cad5; max-width:560px; margin:0 auto 26px; font-size:14.5px;}

/* Footer */
footer.site{background:var(--navy); color:#c3cad5; padding-top:52px;}
.footer-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:36px; padding-bottom:40px; border-bottom:1px solid rgba(255,255,255,.08);}
.footer-brand .brand .name{color:#fff;}
.footer-brand p{font-size:13px; color:#9aa4b2; margin:14px 0;}
.footer-hours{font-size:12.5px; color:#9aa4b2; margin-top:14px;}
.footer-col h5{font-size:12.5px; text-transform:uppercase; letter-spacing:.1em; color:#8993a3; margin:0 0 14px;}
.footer-col ul{list-style:none; margin:0; padding:0;}
.footer-col li{margin-bottom:10px; font-size:13.5px;}
.footer-col a:hover{color:var(--saffron);}
.footer-bottom{padding:20px 0; display:flex; justify-content:space-between; font-size:12px; color:#7c8595; flex-wrap:wrap; gap:8px;}
.disclaimer-line{text-align:center; font-size:11.5px; color:#7c8595; padding:14px 0; border-top:1px solid rgba(255,255,255,.06);}

/* ================= Steps page ================= */
.steps-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
.step-card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 22px; border-bottom:4px solid var(--terracotta);}
.step-num{width:34px; height:34px; border-radius:50%; background:var(--peach); color:var(--terracotta); font-weight:800; font-family:var(--font-display); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:15px;}
.step-card h4{margin:0 0 8px; font-family:var(--font-display); font-size:16px; color:var(--navy);}
.step-card p{font-size:13.5px; color:var(--body); margin:0;}
.sources-block{max-width:760px; margin:0 auto; padding:56px 0;}
.sources-block h5{font-family:var(--font-display); color:var(--navy); font-size:15px; margin:0 0 14px;}
.sources-block ul{margin:0 0 16px; padding-left:20px; color:var(--body); font-size:13.5px;}
.sources-block .note{font-size:12.5px; color:#9aa1ab; border-top:1px solid #eee4d6; padding-top:16px;}

/* ================= Login page ================= */
.login-shell{padding:60px 0 90px;}
.back-link{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; color:var(--navy); margin-bottom:26px;}
.login-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:start;}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px;}
.card h2{font-family:var(--font-display); font-size:1.5rem; margin:0 0 6px; color:var(--navy);}
.card .lede{color:var(--body); font-size:13.5px; margin:0 0 26px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:6px;}
.field input, .field select{width:100%; padding:11px 14px; border-radius:9px; border:1.5px solid #e2e6ea; font-size:14px; font-family:inherit; background:#fbfbfc;}
.field input:focus, .field select:focus{outline:2px solid var(--terracotta); outline-offset:1px; border-color:var(--terracotta);}
.forgot{display:block; text-align:center; margin-top:16px; font-size:13px; font-weight:600; color:var(--terracotta);}
.demo-card{background:#FFF6EC; border:1px solid var(--peach); border-radius:var(--radius); padding:24px;}
.demo-card h4{margin:0 0 4px; color:var(--navy); font-size:14px; font-family:var(--font-display);}
.demo-card .lede{font-size:12.5px; color:var(--body); margin:0 0 16px;}
.demo-card code{background:var(--navy); color:#ffe3c2; padding:2px 8px; border-radius:5px; font-family:var(--font-mono); font-size:12px;}
.demo-account{background:var(--white); border-radius:10px; padding:12px 14px; margin-bottom:10px; border:1px solid #f1e6d5;}
.demo-account:last-child{margin-bottom:0;}
.demo-account .role{font-weight:700; font-size:13.5px; color:var(--navy);}
.demo-account .mail{font-size:12px; color:var(--body); font-family:var(--font-mono);}

/* ================= Jails list ================= */
.app-shell{min-height:60vh;}
.page-head-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
.page-head-row h1{font-family:var(--font-display); font-size:1.9rem; margin:0 0 6px; color:var(--navy);}
.page-head-row .lede{color:var(--body); font-size:14px; margin:0;}
.crumb{font-size:13px; font-weight:700; color:var(--terracotta); margin-bottom:14px; display:inline-block;}
.jail-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding-bottom:60px;}
.jail-card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; border:1px solid transparent;}
.jail-card:hover{transform:translateY(-3px); box-shadow:0 12px 26px rgba(27,36,48,.12); border-color:var(--peach);}
.jail-card .top-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
.jail-card h3{margin:0; font-size:16.5px; color:var(--navy); font-family:var(--font-display);}
.jail-card .loc{font-size:12.5px; color:var(--body); margin:2px 0 14px;}
.code-chip{background:var(--neutral-bg); color:var(--navy); font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:6px; font-weight:700;}
.pill{display:inline-block; padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700;}
.pill-ok{background:var(--success-bg); color:var(--success);}
.pill-warn{background:#FEF3C7; color:#B45309;}
.pill-full{background:var(--warn-bg); color:var(--warn);}
.jail-card .cap-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.jail-card .inmates-count{font-size:12.5px; color:var(--body);}
.jail-card .ut-row{display:flex; justify-content:space-between; font-size:13px; padding-top:12px; border-top:1px solid #f1ece1;}
.jail-card .ut-row b{color:var(--terracotta); font-family:var(--font-display); font-size:15px;}

/* ================= Jail detail ================= */
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:16px;}
.detail-head h1{font-family:var(--font-display); font-size:1.8rem; margin:0 0 4px; color:var(--navy);}
.detail-head .loc{color:var(--body); font-size:13.5px;}
.detail-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.tabbar{display:flex; gap:26px; border-bottom:1.5px solid #ece2d3; margin-bottom:28px;}
.tabbar button{background:none; border:none; padding:12px 2px; font-weight:700; font-size:14.5px; color:var(--body); border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:6px;}
.tabbar button.active{color:var(--terracotta); border-color:var(--terracotta);}
.tabbar .badge-count{background:var(--warn); color:#fff; font-size:10.5px; padding:1px 6px; border-radius:999px;}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px;}
.stat-cards.second-row{grid-template-columns:repeat(3,1fr); margin-top:16px;}
.mini-stat{background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:20px; border-top:3px solid var(--peach);}
.mini-stat.warn-border{border-top-color:var(--saffron);}
.mini-stat .k{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--body); margin-bottom:8px;}
.mini-stat .v{font-family:var(--font-display); font-size:1.9rem; color:var(--navy); font-weight:700;}
.mini-stat .sub{font-size:11.5px; color:#9aa1ab; margin-top:4px;}
.panel{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; margin-top:24px;}
.panel h3{margin:0 0 4px; font-family:var(--font-display); font-size:16px; color:var(--navy);}
.panel .sub{color:var(--body); font-size:13px; margin:0 0 18px;}
.activity-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #f2ece2;}
.activity-item:last-child{border-bottom:none;}
.dot-blue{width:8px; height:8px; border-radius:50%; background:#3B82F6; margin-top:7px; flex-shrink:0;}
.dot-green{width:8px; height:8px; border-radius:50%; background:var(--success); margin-top:7px; flex-shrink:0;}
.activity-item .txt{font-size:13.5px; color:var(--heading);}
.activity-item time{display:block; font-size:11.5px; color:var(--body); margin-top:2px;}

table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.data-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--body); padding:10px 12px; border-bottom:1.5px solid #ece2d3;}
table.data-table td{padding:14px 12px; border-bottom:1px solid #f2ece2; color:var(--heading);}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr.clickable:hover{background:#FFF9F2; cursor:pointer;}
select.role-select{padding:7px 10px; border-radius:8px; border:1.5px solid #e2e6ea; font-size:13px; font-family:inherit;}
.status-active{background:var(--success-bg); color:var(--success); padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700;}
.link-danger{color:var(--warn); font-weight:700; font-size:12.5px;}
.empty-tab{padding:60px 20px; text-align:center; color:var(--body);}
.empty-tab .ic{font-size:40px; margin-bottom:12px;}

/* ================= Prisoners list ================= */
.filters-row{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
.filters-row input[type=text]{flex:1; min-width:220px; padding:11px 16px; border-radius:9px; border:1.5px solid #e2e6ea; font-size:13.5px; font-family:inherit;}
.filters-row select{padding:11px 14px; border-radius:9px; border:1.5px solid #e2e6ea; font-size:13.5px; font-family:inherit; background:#fff;}
.status-pill{display:inline-block; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700;}
.status-eligible{background:var(--success-bg); color:var(--success);}
.status-noteligible{background:#FEF3C7; color:#B45309;}
.status-excluded{background:var(--warn-bg); color:var(--warn);}
.status-pending{background:var(--neutral-bg); color:var(--navy);}

/* ================= Modal ================= */
.modal-overlay{position:fixed; inset:0; background:rgba(20,15,10,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:#fff; border-radius:16px; width:100%; max-width:680px; max-height:88vh; overflow-y:auto; padding:32px;}
.modal-box .mhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.modal-box h2{font-family:var(--font-display); font-size:1.35rem; margin:0; color:var(--navy);}
.modal-close{background:none; border:none; font-size:20px; color:var(--body); cursor:pointer;}
.subhead-form{font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--terracotta); margin:22px 0 12px;}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.form-grid3{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:end;}
.checkbox-row{display:flex; gap:20px; align-items:center; font-size:13.5px; color:var(--heading); margin-bottom:18px;}
.checkbox-row label{display:flex; align-items:center; gap:7px;}
.info-note{background:#FFF6EC; border:1px solid var(--peach); border-radius:10px; padding:12px 14px; font-size:12.5px; color:#8a4a1c; margin-bottom:20px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:8px;}

/* ================= Prisoner profile ================= */
.profile-head{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:16px;}
.profile-id{display:flex; align-items:center; gap:16px;}
.avatar-circle{width:58px; height:58px; border-radius:50%; background:var(--peach); color:var(--terracotta); font-family:var(--font-display); font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center;}
.profile-id h2{margin:0; font-family:var(--font-display); font-size:1.4rem; color:var(--navy);}
.profile-id .meta{font-size:13px; color:var(--body); margin-top:3px;}
.tabpills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.tabpills button{background:var(--white); border:1.5px solid #e9e0d1; padding:9px 16px; border-radius:999px; font-weight:700; font-size:13px; color:var(--navy);}
.tabpills button.active{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
.info-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
.info-grid.three{grid-template-columns:repeat(3,1fr);}
.info-field .k{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--body); font-weight:700; margin-bottom:6px;}
.info-field .v{font-size:14.5px; color:var(--heading); font-weight:600;}
.eligibility-row{display:flex; align-items:center; gap:12px;}
.eligibility-row .reason{color:var(--body); font-size:13.5px;}
.timestamp-note{font-size:11.5px; color:#9aa1ab; margin-top:10px;}

.stepper{display:flex; justify-content:space-between; position:relative; margin:10px 0 20px;}
.stepper::before{content:""; position:absolute; top:16px; left:5%; right:5%; height:2px; background:#ece2d3; z-index:0;}
.step-node{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; width:16%;}
.step-circle{width:34px; height:34px; border-radius:50%; background:#ece2d3; color:var(--body); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-bottom:8px; border:3px solid var(--white);}
.step-node.done .step-circle{background:var(--terracotta); color:#fff;}
.step-node .lbl{font-size:12.5px; font-weight:700; color:var(--body);}
.step-node.done .lbl{color:var(--terracotta);}
.step-node .dt{font-size:10.5px; color:#a7adb6; margin-top:2px;}
.app-status-row{display:flex; justify-content:space-between; align-items:center; background:#FBF9F5; border-radius:10px; padding:14px 18px; margin-top:6px; flex-wrap:wrap; gap:10px;}
.review-pill{background:#FEF3C7; color:#B45309; font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px;}
.skillpassport-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.notes-add-row{display:flex; gap:10px; margin-bottom:16px;}
.notes-add-row input{flex:1; padding:11px 14px; border-radius:9px; border:1.5px solid #e2e6ea; font-size:13.5px; font-family:inherit;}
.note-item{background:#FBF9F5; border-radius:10px; padding:14px 16px; font-size:13.5px; color:var(--heading);}
.note-item .who{display:block; font-size:11.5px; color:var(--body); margin-top:6px;}

/* Responsive */
@media (max-width:980px){
  nav.main-links{display:none;}
  .hero-inner{grid-template-columns:1fr; text-align:center;}
  .hero .cta-row, .mission-strip .wrap{justify-content:center;}
  .hero-art{order:-1; max-width:320px; margin:0 auto;}
  .stats-grid, .feature-grid, .updates-grid, .jail-grid, .steps-grid{grid-template-columns:repeat(2,1fr);}
  .stats-grid .stat:nth-child(3){border-left:none;}
  .about-grid, .resources-grid, .login-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .stat-cards{grid-template-columns:repeat(2,1fr);}
  .info-grid, .info-grid.three{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:600px){
  .stats-grid, .feature-grid, .updates-grid, .jail-grid, .steps-grid, .footer-grid, .form-grid2, .stat-cards, .info-grid, .info-grid.three{grid-template-columns:1fr;}
  .stats-grid .stat, .stat-cards .mini-stat{border-left:none !important;}
  .hero h1.wordmark{font-size:3rem;}
}
</style>

function activityFeed(){

    {dot:'blue', txt: `Smoke Admit Test — ${t('act.filed')}`, time:'22 Aug 2026, 1:47 pm'},
    {dot:'green', txt: `Smoke Admit Test — ${t('act.admitted')}`, time:'22 Aug 2026, 1:47 pm'},
    {dot:'green', txt: `Smoke Admit Test — ${t('act.admitted')}`, time:'22 Aug 2026, 1:46 pm'},

function statusPillHtml(status){
  const map = {
    eligible:['status-eligible','Eligible','पात्र'],
    noteligible:['status-noteligible','Not Eligible','अपात्र'],
    excluded:['status-excluded','Excluded','बहिष्कृत'],
    pending:['status-pending','Pending','लंबित']
  };
  const m = map[status]||map.pending;
  return `<span class="status-pill ${m[0]}">${lang==='hi'?m[2]:m[1]}</span>`;
}
function stageLabel(stage){
  const map = {flagged:'stage1', drafted:'stage2', filed:'stage3', hearing:'stage4', orderpassed:'stage5', released:'stage6', none:null};
  const key = map[stage];
  return key ? t(key) : '—';
}

    <td style="font-family:var(--font-mono); font-size:12px;">${p.caseno}</td>
    <td>${p.offence}</td><td>${p.custody}</td><td>${statusPillHtml(p.status)}</td><td>${stageLabel(p.stage)}</td>
  </tr>`).join('');
  return `<div class="wrap app-shell" style="padding-top:34px; padding-bottom:70px;">
    <a class="crumb" href="#" onclick="openJail('${j.id}')">${t('back.jailportal')}</a>

function findPrisoner(id){ return PRISONERS.find(p=>p.id===id) || PRISONERS[0]; }

function pagePrisoner(){
  const j = findJail(state.jailId);

  const hasDetail = !!p.dob;

    ['personal', t('prof.tab.personal')],
    ['case', t('prof.tab.case')],
    ['elig', t('prof.tab.elig')],
    ['progress', t('prof.tab.progress')],

  ];

  let body = '';

    body = `<div class="panel"><div class="empty-tab"><div class="ic">📄</div><p>${t('elig.reason.custody')}</p></div></div>`;

    const elig = p.status==='eligible' ? 'status-eligible' : (p.status==='excluded'?'status-excluded':'status-noteligible');

    if(state.prisonerTab==='personal'){
      body = `<div class="panel"><h3>${t('personalinfo.h')}</h3>

        </div></div>`;
    } else if(state.prisonerTab==='case'){
      body = `<div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><h3>${t('casedet.h')}</h3><button class="btn btn-outline btn-sm">${t('casedet.edit')}</button></div>
        <div class="info-grid" style="margin-top:14px;">
          <div class="info-field"><div class="k">${t('f.caseno')}</div><div class="v" style="font-family:var(--font-mono); font-size:13px;">${p.caseno}</div></div>
          <div class="info-field"><div class="k">${t('f.cnr')}</div><div class="v" style="font-family:var(--font-mono); font-size:13px;">${p.cnr}</div></div>
          <div class="info-field"><div class="k">${t('f.court')}</div><div class="v">${p.court}</div></div>
          <div class="info-field"><div class="k">${t('f.offence')}</div><div class="v">${p.offence}</div></div>
        </div>
        <div class="info-grid" style="margin-top:22px;">
          <div class="info-field"><div class="k">${t('f.maxsentence')}</div><div class="v">${p.maxSentence}</div></div>
          <div class="info-field"><div class="k">${t('f.otherpending')}</div><div class="v">${p.otherPending}</div></div>
          <div class="info-field"><div class="k">${t('f.custodystart')}</div><div class="v">${p.custodyStart}</div></div>
          <div class="info-field"><div class="k">${t('f.flags')}</div><div class="v">${p.flags}</div></div>
        </div>
      </div>`;
    } else if(state.prisonerTab==='elig'){
      body = `<div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><h3>${t('elig.h')}</h3><button class="btn btn-outline btn-sm">${t('elig.recompute')}</button></div>
        <div class="eligibility-row" style="margin-top:14px;">${statusPillHtml(p.status)}<span class="reason">${t(eligReasonKey)}</span></div>
        <div class="timestamp-note">${t('elig.lastcomputed')} ${p.lastComputed}</div>
      </div>`;
    } else if(state.prisonerTab==='progress'){
      const curIdx = STAGE_KEY[p.stage] ?? -1;
      const nodes = STAGES.map((sk,i)=>`<div class="step-node ${i<=curIdx?'done':''}">
        <div class="step-circle">${i+1}</div><div class="lbl">${t(sk)}</div>${i===curIdx?`<div class="dt">${p.stageDate||''}</div>`:''}

            <button class="btn btn-primary btn-sm">${t('btn.advance')}</button>
          </div>
        </div>
      </div>`;
    } else if(state.prisonerTab==='skill'){
      body = `<div class="panel"><h3>${t('skill.h')}</h3>

        </div>
      </div>`;
    } else if(state.prisonerTab==='notes'){
      body = `<div class="panel"><h3>${t('notes.h')}</h3>
        <div class="notes-add-row" style="margin-top:14px;">
          <input type="text" placeholder="${t('notes.placeholder')}">
          <button class="btn btn-navy btn-sm">${t('notes.add')}</button>
        </div>
        <div class="note-item">${t('note.sample')}<span class="who">Kiran Joshi · 7 Aug 2026, 1:18 pm</span></div>
      </div>`;
    }
  }

  return `<div class="wrap app-shell" style="padding-top:34px; padding-bottom:70px;">
    <a class="crumb" href="#" onclick="openPrisoners('${j.id}')">${t('back.allprisoners')}</a>
    <div class="profile-head">
      <div class="profile-id">
        <div class="avatar-circle">${initial(p.name)}</div>
        <div><h2>${p.name}</h2><div class="meta">${t('prof.regno')} ${p.reg} · ${p.admdate||''} ${t('prof.admission')} · ${t('gender.m')}</div></div>
      </div>

    <div class="tabpills">${tabBtns}</div>
    ${body}
  </div>`;
}

/* ============================= Master render ============================= */
function render(){
  document.querySelectorAll('nav.main-links a').forEach(a=>a.classList.remove('current'));
  renderHeaderActions();
  let html='';
  if(state.route==='home'){ html = pageHome(); document.querySelector('nav.main-links a[onclick*="home"]').classList.add('current'); }
  else if(state.route==='how'){ html = pageHow(); document.querySelector('nav.main-links a[onclick*="how"]').classList.add('current'); }
  else if(state.route==='login'){ html = pageLogin(); }
  else if(state.route==='jails'){ html = pageJails(); document.querySelector('nav.main-links a[onclick*="jails"]').classList.add('current'); }
  else if(state.route==='jail'){ html = pageJail(); }
  else if(state.route==='prisoners'){ html = pagePrisoners(); }
  else if(state.route==='prisoner'){ html = pagePrisoner(); }
  html += siteFooter();
  document.getElementById('app').innerHTML = html;
  // patch feature grid placeholder on home page (built after render for dynamic icons)
  const fg = document.querySelector('.feature-grid');
  if(fg) fg.innerHTML = featureGrid();
}

render();
